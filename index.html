<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Core: Mobile adaptation code to ensure proper layout on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Homepage</title>
    <style>
        /* Global style reset and basic settings */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Gradient background */
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Card styling */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* Avatar styling */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #eee;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: #764ba2;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 { font-size: 28px; margin-bottom: 10px; color: #333; }
        p { font-size: 16px; color: #666; margin-bottom: 25px; line-height: 1.6; }

        /* Button styling */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #764ba2;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .btn:hover { background-color: #667eea; transform: translateY(-2px); }

        /* Responsive adjustments for mobile screens */
        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 24px; }
            .avatar { width: 100px; height: 100px; font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Replace with your own avatar link, or just use an emoji -->
        <div class="avatar">👋</div>
        
        <h1>Hi, I'm [Quentin]</h1>
        <p>Welcome to my personal homepage!<br>This is a simple website hosted on GitHub Pages.</p >
        
        <!-- Replace with your own link -->
        <a href=" " target="_blank" class="btn">Visit My GitHub</a >
    </div>
</body>
</html>
